extends: ../alignment_v4/base.yaml

# Reframed Wave 1: distillation is tested only after the Wave 0 recipe
# correction. The student architecture and COCO development split stay fixed.
data:
  train_csv: data/splits/alignment_v3_recovery/coco_train_minus_dev.csv
  val_csv: data/splits/alignment_v3_recovery/coco_dev_5000.csv
  final_csv: data/val_all_captions.csv
  full_train_csv: data/splits/coco_train_all_captions.csv
  train_captions_per_image: null
  image_size: 256
  num_workers: 12
  persistent_workers: true

model:
  vision_encoder: dinov3_vits16
  text_encoder: all_minilm_l6_v2

recipe:
  adapter: false
  distillation: false
  lora: false
  loss_type: infonce_no_queue

training:
  batch_size: 1024
  epochs: 12
  memory_queue_size: 0
  lr: 0.0003
  lr_reference_batch_size: 128
  lr_scale_rule: sqrt
  max_lr_scale: 3.0
  precision: bf16
  allow_tf32: true

distillation:
  strength: 1.0

