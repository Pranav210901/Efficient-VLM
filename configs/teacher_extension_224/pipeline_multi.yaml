version: teacher-extension-224-multi-1.0
output_root: results/teacher_extension_224/multi
checkpoint_root: checkpoints/teacher_extension_224/multi
log_root: logs/teacher_extension_224
base_config: configs/teacher_extension_224/base_multi.yaml

experiment: {image_size: 224}
wave1:
  enabled: true
  design: selected_resolution_distillation_only
  locked_recipe:
    loss_type: infonce_no_queue
    captions_per_image: null
    memory_queue_size: 0
    batch_size: 1024
    sweep_multiplier: 3.0
    image_size: 224
split:
  source_csv: data/splits/coco_train_all_captions.csv
  train_csv: data/splits/alignment_v3_recovery/coco_train_minus_dev.csv
  dev_csv: data/splits/alignment_v3_recovery/coco_dev_5000.csv
  final_csv: data/val_all_captions.csv
  manifest: results/alignment_v4_wave0/manifests/split.json
  dev_images: 5000
  seed: 3103
teacher_extension:
  arm_id: mobileclip2_siglip2_equal
  label: DINOv3 ViT-S/16 + MiniLM, MobileCLIP2 + SigLIP2 distilled, 224px
  teacher_ids: [mobileclip2_s0_dfndr2b, siglip2_vit_b32_256_webli]
  matched_protocol: true
  loss_combination:
    type: independent_scalar_losses
    weights: {mobileclip2: 0.5, siglip2: 0.5}
    weighting_status: explicit_untuned_default
references: [mobileclip2_s0_dfndr2b, siglip2_vit_b32_256_webli]
pair_matrix:
  vision_encoders: [dinov3_vits16]
  text_encoders: [all_minilm_l6_v2]
  seeds: [42]
  batch_sizes: [1024]
batch_probe: {enabled: false, candidates: [1024]}
probe:
  enabled: false
  cache_csv: data/splits/alignment_v3_recovery/coco_train_minus_dev.csv
selection: {}
distillation_sensitivity:
  strengths: [1.0]
  seeds: [42, 43, 44]
  include_matched_baseline: false
ablations: {seeds: [], recipes: []}
final: {seeds: [], epochs: 24, retrain_on_full_coco_train: false}
optional_transfer:
  flickr30k_csv: data/flickr30k/validation.csv
  required: true
literature_context: []
trajectory:
  epochs: 24
  old_12epoch_flickr_validation_mean_R1: 0.4378698269526164
