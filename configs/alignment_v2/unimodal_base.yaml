seed: 42
deterministic: false
device: auto

data:
  # Grouping loads each image once and samples two of its five captions per
  # epoch. Validation retains all captions and deduplicates image queries.
  train_csv: data/splits/coco_train_all_captions.csv
  val_csv: data/val_all_captions.csv
  image_root: .
  image_size: 224
  group_by_image: true
  train_captions_per_image: 2
  val_captions_per_image:
  interpolation: bicubic
  # Evaluation jobs request ten CPUs, so ten workers is the common safe upper
  # bound for both training and matched evaluation.
  num_workers: 10
  pin_memory: true
  persistent_workers: true

model:
  vision_encoder: dinov2_vits14
  text_encoder: all_minilm_l6_v2
  shared_dim: 384
  fusion_dim: 512
  projection_hidden_dim: 768
  projection_dropout: 0.05
  projection_type: residual
  use_local_blf: false
  use_global_blf: false
  fusion_type: concat_mlp
  local_dim: 128
  global_dim: 128
  freeze_vision: true
  freeze_text: true
  pretrained_vision: true
  pretrained_text: true
  vision_backend: auto
  text_prefix:

training:
  batch_size: 128
  drop_last: true
  epochs: 12
  lr: 0.0003
  betas: [0.9, 0.98]
  weight_decay: 0.01
  scheduler: cosine
  warmup_fraction: 0.05
  memory_queue_size: 4096
  gradient_clip_norm: 1.0
  selection_metric: mean_R@1
  early_stopping_patience: 3
  amp: true
  keep_latest: true
  save_dir: checkpoints/alignment_v2/placeholder

evaluation:
  k_values: [1, 5, 10]

benchmark:
  warmup: 10
  iterations: 50
  image_batch_size: 1
  text_batch_size: 1
