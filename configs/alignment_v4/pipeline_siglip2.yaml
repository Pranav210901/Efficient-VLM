version: alignment-v4-siglip2-1.0
output_root: results/alignment_v4/siglip2
checkpoint_root: checkpoints/alignment_v4/siglip2
log_root: logs/alignment_v4/siglip2
base_config: configs/alignment_v4/base_siglip2.yaml

split:
  source_csv: data/splits/coco_train_all_captions.csv
  train_csv: data/splits/alignment_v3_recovery/coco_train_minus_dev.csv
  dev_csv: data/splits/alignment_v3_recovery/coco_dev_5000.csv
  final_csv: data/val_all_captions.csv
  manifest: results/alignment_v4/siglip2/manifests/split.json
  dev_images: 5000
  seed: 3103

references: [siglip2_vit_b32_256_webli]
pair_matrix:
  vision_encoders: [dinov3_vits16]
  text_encoders: [all_minilm_l6_v2]
  seeds: [42]
  batch_sizes: [512]
batch_probe:
  enabled: false
  candidates: [512]

probe:
  enabled: true
  teacher_r1: 0.5688067078590393
  teacher_anchor_split: sealed_coco_val_5000
  probe_split: coco_dev_5000
  cache_csv: data/splits/alignment_v3_recovery/coco_train_minus_dev.csv
  viable_distilled_r1: 0.30
  nonviable_distilled_r1: 0.22

selection:
  practical_equivalence_margin: 0.005
  pair_minimum_mean_r1: 0.20
  pair_minimum_gain_over_v2: 0.03
  v2_best_mean_r1: 0.1560
  distillation_minimum_gain: 0.02
  distillation_minimum_mean_r1: 0.30
  recipe_minimum_gain_over_matched_baseline: 0.02
  router_minimum_unique_oracle_gain: 0.02
  router_minimum_openclip_fraction: 0.90

distillation_sensitivity:
  strengths: [1.0]
  seeds: [42, 43]
  include_matched_baseline: true
ablations:
  seeds: [42, 43]
  recipes: []
final:
  seeds: [42, 43]
  epochs: 12
  retrain_on_full_coco_train: false
optional_transfer:
  flickr30k_csv: data/flickr30k/test.csv
  required: false
literature_context: []

