version: alignment-v3-recovery-1.0
output_root: results/alignment_v3_recovery
checkpoint_root: checkpoints/alignment_v3_recovery
log_root: logs/alignment_v3_recovery
base_config: configs/alignment_v3_recovery/base.yaml

split:
  source_csv: data/splits/coco_train_all_captions.csv
  train_csv: data/splits/alignment_v3_recovery/coco_train_minus_dev.csv
  dev_csv: data/splits/alignment_v3_recovery/coco_dev_5000.csv
  final_csv: data/val_all_captions.csv
  manifest: results/alignment_v3_recovery/manifests/split.json
  dev_images: 5000
  seed: 3103

references:
  - openclip_vit_b32_quickgelu_openai
  - mobileclip2_s0_dfndr2b
  - siglip2_vit_b32_256_webli

# Locked result of the immutable v3 encoder-pair screen. The four batch sizes
# are independent seed-42 jobs; no throughput probe can override them.
pair_matrix:
  vision_encoders: [dinov3_vits16]
  text_encoders: [all_minilm_l6_v2]
  seeds: [42]
  batch_sizes: [512, 768, 1024, 2048]

batch_probe:
  enabled: false
  candidates: [512, 768, 1024, 2048]

recovery:
  confirmation_top_k: 2
  confirmation_seeds: [43]
  direct_recipe_study: true
  distillation_strength: 1.0

# Identical pair continuation gate to the official v3 screen. This is applied
# to the two-seed mean of the best confirmed fixed-batch setting.
selection:
  practical_equivalence_margin: 0.005
  pair_minimum_mean_r1: 0.20
  pair_minimum_gain_over_v2: 0.03
  v2_best_mean_r1: 0.1560
  distillation_minimum_gain: 0.02
  distillation_minimum_mean_r1: 0.30
  recipe_minimum_gain_over_matched_baseline: 0.02
  router_minimum_unique_oracle_gain: 0.02
  router_minimum_openclip_fraction: 0.90

# Retained for runner schema compatibility. The recovery workflow proceeds
# directly to the compact matched four-recipe study if the pair gate passes.
distillation_sensitivity:
  strengths: [1.0]
  seeds: [42, 43]
  include_matched_baseline: true

ablations:
  seeds: [42, 43]
  recipes:
    - {id: baseline, adapter: false, distillation: false, lora: false}
    - {id: distillation, adapter: false, distillation: true, lora: false}
    - {id: lora, adapter: false, distillation: false, lora: true}
    - {id: distillation_lora, adapter: false, distillation: true, lora: true}

final:
  seeds: [42, 43, 44]
  epochs: 12
  retrain_on_full_coco_train: true

optional_transfer:
  flickr30k_csv: data/flickr30k/test.csv
  required: false

literature_context:
  - id: dinov2_large_all_roberta_large
    source: literature
    note: cited ceiling; never represented as locally evaluated
