ambiguity:
  primary_metric: tfidf_word_unigram_bigram_cosine
  robustness_metric: BAAI/bge-small-en-v1.5
  robustness_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  cross_image_primary: mean_top5
  cross_image_secondary: maximum
  bins: terciles

ranking:
  similarity: cosine_l2_normalized
  dtype: float32_cpu
  tie_break: similarity_descending_then_frozen_gallery_index_ascending
  k_values: [1, 5, 10]

bootstrap:
  replicates: 1000
  seed: 20260731
  interval_percent: 95

exports:
  audit_seed: 20260731
  failure_seed: 20260732
  audit_size: 100
  failure_size_per_direction: 50
  display_seed: 42

evaluation:
  batch_size: 128
  num_workers: 12
  precision: bf16
  repeat_for_determinism: true

resources:
  partition: teaching
  gpu_type: NVIDIA RTX PRO 6000 Blackwell
  cpus_per_gpu: 12
  host_memory: 96G
  wall_time: "04:00:00"
  array_concurrency: 4

limitations:
  - BGE-Small and MiniLM were trained with related sentence-embedding objectives and potentially overlapping web/NLI sources; BGE is non-circular here but is not independent semantic ground truth.
  - OpenCLIP uses its checkpoint-native fixed 77-token context while MiniLM dynamically pads each batch. This does not alter the common gallery, cosine ranking rule, or retrieval ordering protocol.
  - Ambiguity association is not an absolute irrecoverable performance ceiling.
